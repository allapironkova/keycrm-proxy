<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyCRM × Claude — AI Аналітика</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #e8e2d9; font-family: 'DM Sans', sans-serif; font-weight: 300; min-height: 100vh; }
  .app { max-width: 900px; margin: 0 auto; padding: 48px 24px; }
  .header { margin-bottom: 48px; border-bottom: 1px solid #222; padding-bottom: 32px; }
  .logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 400; color: #e8e2d9; margin-bottom: 8px; }
  .logo span { color: #b89a6a; }
  .subtitle { font-size: 13px; color: #666; letter-spacing: 0.1em; text-transform: uppercase; }
  .section { background: #111; border: 1px solid #222; padding: 28px; margin-bottom: 32px; }
  .label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #b89a6a; margin-bottom: 16px; }
  .row { display: flex; gap: 12px; align-items: center; }
  input[type=password], input[type=text] { flex: 1; background: #0a0a0a; border: 1px solid #333; color: #e8e2d9; padding: 12px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; }
  input:focus { border-color: #b89a6a; }
  input::placeholder { color: #444; }
  .btn { background: #b89a6a; color: #0a0a0a; border: none; padding: 12px 24px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #caa87a; }
  .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 12px; color: #666; }
  .status.ok { color: #6ab87a; }
  .status.err { color: #b86a6a; }
  .note { margin-top: 8px; font-size: 11px; color: #444; line-height: 1.6; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 14px; background: #111; color: #666; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 400; border-bottom: 1px solid #222; }
  td { padding: 11px 14px; border-bottom: 1px solid #1a1a1a; color: #c8c2b9; }
  tr:hover td { background: #111; }
  .chat-header { padding: 20px 24px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; background: #b89a6a; border-radius: 50%; }
  .chat-title { font-size: 13px; font-weight: 500; }
  .messages { padding: 24px; min-height: 300px; max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 12px; align-items: flex-start; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; flex-shrink: 0; }
  .avatar.user { background: #333; color: #b89a6a; }
  .avatar.ai { background: #b89a6a22; color: #b89a6a; border: 1px solid #b89a6a44; }
  .content { flex: 1; font-size: 14px; line-height: 1.7; color: #c8c2b9; }
  .content.user { color: #e8e2d9; }
  .thinking { display: flex; gap: 4px; align-items: center; }
  .thinking span { width: 6px; height: 6px; background: #b89a6a; border-radius: 50%; animation: blink 1.2s infinite; }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  .chat-input-row { padding: 16px 24px; border-top: 1px solid #222; display: flex; gap: 10px; }
  .quick-btns { padding: 0 24px 20px; display: flex; flex-wrap: wrap; gap: 8px; }
  .quick-btn { background: transparent; border: 1px solid #2a2a2a; color: #888; padding: 7px 14px; font-family: 'DM Sans', sans-serif; font-size: 11px; cursor: pointer; }
  .quick-btn:hover { border-color: #b89a6a; color: #b89a6a; }
  .empty { text-align: center; padding: 60px 24px; color: #444; font-size: 13px; }
  .tbl-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">KeyCRM <span>x</span> Claude</div>
    <div class="subtitle">AI-аналітика товарів і фінансів</div>
  </div>

  <div class="section">
    <div class="label">Підключення до KeyCRM</div>
    <div class="row">
      <input type="password" id="apiKey" placeholder="Вставте ваш API ключ з KeyCRM - Налаштування - Основні">
      <button class="btn" onclick="loadProducts()">Підключити</button>
    </div>
    <div id="status" class="status"></div>
    <div class="note">API ключ знаходиться в KeyCRM - Налаштування - Основні - рядок "API-ключ".</div>
  </div>

  <div id="productsSection" style="display:none; margin-bottom:32px;">
    <div class="tbl-header">
      <div class="label" style="margin:0">Завантажені товари</div>
      <div id="countLabel" style="font-size:12px;color:#666;"></div>
    </div>
    <table>
      <thead><tr><th>Назва</th><th>Ціна</th><th>Собівартість</th><th>Маржа</th><th>Залишок</th></tr></thead>
      <tbody id="productsTable"></tbody>
    </table>
  </div>

  <div class="section" style="padding:0;">
    <div class="chat-header"><div class="dot"></div><div class="chat-title">AI-аналітик</div></div>
    <div class="messages" id="messages">
      <div class="empty">Підключіть KeyCRM щоб почати аналіз</div>
    </div>
    <div class="quick-btns" id="quickBtns" style="display:none;">
      <button class="quick-btn" onclick="ask('Які товари найприбутковіші?')">Які товари найприбутковіші?</button>
      <button class="quick-btn" onclick="ask('Де зависли гроші у стоках?')">Де зависли гроші у стоках?</button>
      <button class="quick-btn" onclick="ask('Яка середня маржа по асортименту?')">Яка середня маржа?</button>
      <button class="quick-btn" onclick="ask('Що варто докупити наступного разу?')">Що докупити?</button>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Задайте питання по вашим товарам..." disabled onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="btn" id="sendBtn" onclick="sendMsg()" disabled>-></button>
    </div>
  </div>
</div>

<script>
let products = [];
let messages = [];
let thinking = false;

async function loadProducts() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { setStatus('Введіть API ключ', 'err'); return; }
  products = [];
  let page = 1;
  try {
    while (true) {
      setStatus('Завантаження сторінки ' + page + '... (' + products.length + ' товарів)', '');
      const res = await fetch('/api/proxy?endpoint=products%3Flimit%3D50%26page%3D' + page, {
        headers: { 'x-api-key': key }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Помилка ' + res.status);
      const batch = data.data || data || [];
      if (!Array.isArray(batch) || batch.length === 0) break;
      products = products.concat(batch);
      if (batch.length < 50) break;
      page++;
      if (page > 20) break;
    }
    setStatus('Завантажено ' + products.length + ' товарів', 'ok');
    renderTable();
    document.getElementById('chatInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('quickBtns').style.display = 'flex';
    addMsg('ai', 'Підключено до KeyCRM. Завантажено **' + products.length + ' товарів**. Можу проаналізувати собівартість, маржинальність та рух закупок. Що вас цікавить?');
  } catch(e) {
    setStatus('Помилка: ' + e.message, 'err');
  }
}

function renderTable() {
  const tbody = document.getElementById('productsTable');
  document.getElementById('productsSection').style.display = 'block';
  document.getElementById('countLabel').textContent = products.length + ' позицій';
  tbody.innerHTML = products.slice(0,15).map(function(p) {
    var price = p.price || p.sell_price || 0;
    var cost = p.cost_price || p.purchase_price || 0;
    var qty = p.quantity != null ? p.quantity : (p.stock != null ? p.stock : '—');
    var margin = cost && price ? (((price-cost)/price)*100).toFixed(1) : '—';
    var mcolor = margin > 30 ? '#6ab87a' : margin > 15 ? '#b89a6a' : '#b86a6a';
    return '<tr><td>' + (p.name||p.title||'—') + '</td><td style="color:#b89a6a">' + (price?price+' грн':'—') + '</td><td style="color:#888">' + (cost?cost+' грн':'—') + '</td><td style="color:' + mcolor + '">' + (margin!=='—'?margin+'%':'—') + '</td><td style="color:#888">' + qty + '</td></tr>';
  }).join('');
}

function buildContext() {
  return products.slice(0,50).map(function(p) {
    var price = p.price || p.sell_price || 0;
    var cost = p.cost_price || p.purchase_price || 0;
    var qty = p.quantity != null ? p.quantity : '?';
    var margin = cost && price ? (((price-cost)/price)*100).toFixed(1) : '?';
    return '- ' + (p.name||p.title||'—') + ' | Ціна: ' + price + ' грн | Собівартість: ' + cost + ' грн | Маржа: ' + margin + '% | Залишок: ' + qty + ' шт';
  }).join('\n');
}

function ask(q) { document.getElementById('chatInput').value = q; sendMsg(); }

async function sendMsg() {
  var input = document.getElementById('chatInput');
  var msg = input.value.trim();
  if (!msg || thinking) return;
  input.value = '';
  addMsg('user', msg);
  messages.push({role:'user', content: msg});
  thinking = true;
  showThinking();
  try {
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: 'Ти фінансовий AI-аналітик fashion бізнесу. Дані товарів з KeyCRM (всього ' + products.length + ' товарів):\n' + buildContext() + '\n\nВідповідай чітко, по суті, з конкретними цифрами. Мова: українська або російська.',
        messages: messages.map(function(m) { return {role: m.role==='ai'?'assistant':'user', content: m.content}; })
      })
    });
    var data = await res.json();
    var reply = data.content && data.content[0] ? data.content[0].text : 'Помилка отримання відповіді.';
    messages.push({role:'ai', content: reply});
    removeThinking();
    addMsg('ai', reply);
  } catch(e) {
    removeThinking();
    addMsg('ai', 'Помилка: ' + e.message);
  }
  thinking = false;
}

function addMsg(role, text) {
  var box = document.getElementById('messages');
  if (box.querySelector('.empty')) box.innerHTML = '';
  var div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = '<div class="avatar ' + role + '">' + (role==='user'?'Ви':'AI') + '</div><div class="content ' + role + '">' + text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>') + '</div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function showThinking() {
  var box = document.getElementById('messages');
  var div = document.createElement('div');
  div.className = 'msg'; div.id = 'thinking';
  div.innerHTML = '<div class="avatar ai">AI</div><div class="content"><div class="thinking"><span></span><span></span><span></span></div></div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function removeThinking() {
  var t = document.getElementById('thinking');
  if (t) t.remove();
}

function setStatus(msg, type) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}
</script>
</body>
</html>
